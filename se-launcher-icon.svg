  <text x="30" y="36" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#E8F0FC" text-anchor="middle">S</text>
  <!-- E azul claro -->
  <rect x="54" y="14" width="32" height="32" rx="7" fill="#60A5FA"/>
  <text x="70" y="36" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">E</text>
  <!-- quadrado inferior esquerdo -->
